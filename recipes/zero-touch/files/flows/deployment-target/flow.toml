name = "deployment-target"
version = "1.0.1"
description = "Check for a new deployment target"

# Periodic trigger: shell script calls the /rollout endpoint.
# On 201 the script echoes the JSON response body; on 204 it outputs nothing.
[input.process]
command = """/etc/tedge/mappers/c8y/flows/deployment-request/deployment.sh check --group ${params.group} --version ${params.version}"""
interval = "${params.interval}"

[config]
group = "${params.group}"
version = "${params.version}"

[[steps]]
script = "main.js"
