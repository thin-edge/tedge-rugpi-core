table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;

        # 1. Allow anything coming from the host itself (loopback)
        iif "lo" accept

        # Allow established/related connections
        ct state established,related accept

        # 2. Allow MQTT and HTTP from the broad Podman subnet range (IPv4)
        ip saddr 10.88.0.0/16 tcp dport { 1883, 8000-8001 } accept
        ip saddr 10.89.0.0/16 tcp dport { 1883, 8000-8001 } accept

        # Allow MQTT and HTTP from Docker bridge network (IPv4)
        ip saddr 172.17.0.0/16 tcp dport { 1883, 8000-8001 } accept

        # Allow MQTT and HTTP from Podman/Docker subnets (IPv6 ULA)
        ip6 saddr fd00::/8 tcp dport { 1883, 8000-8001 } accept

        # 3. Explicitly drop all other traffic to these ports from the LAN/Internet
        tcp dport { 1883, 8000-8001 } drop
    }
}