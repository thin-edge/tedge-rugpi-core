#:schema https://raw.githubusercontent.com/silitics/rugix/refs/tags/v0.8.0/schemas/rugix-bakery-project.schema.json
[repositories]
rugix-extra = { git = "https://github.com/silitics/rugix-extra.git", branch = "main" }

[systems.tedge-debian-trixie-efi-arm64]
layer = "tedge-debian-trixie-efi"
architecture = "arm64"
target = "generic-grub-efi"

[systems.tedge-debian-trixie-efi-amd64]
layer = "tedge-debian-trixie-efi"
architecture = "amd64"
target = "generic-grub-efi"

[systems.tedge-debian-bookworm-efi-arm64]
layer = "tedge-debian-bookworm-efi"
architecture = "arm64"
target = "generic-grub-efi"

[systems.tedge-debian-bookworm-efi-amd64]
layer = "tedge-debian-bookworm-efi"
architecture = "amd64"
target = "generic-grub-efi"

# Compatible with:
# - Raspberry Pi 5
# - Raspberry Pi 4 (with recent firmware)
# - Raspberry Pi CM4 (with recent firmware)
[systems.tedge-raspios-arm64-tryboot]
layer = "tedge-raspios"
architecture = "arm64"
target = "rpi-tryboot"

# Compatible with:
# - Raspberry Pi 4 (with recent firmware)
# - Raspberry Pi CM4 (with recent firmware)
# - Raspberry Pi 3
# - Raspberry Pi Zero 2w
# - Raspberry Pi 2
[systems.tedge-raspios-arm64]
layer = "tedge-raspios"
architecture = "arm64"
target = "rpi-uboot"

# Compatible with:
# - Raspberry Pi 1
# - Raspberry Pi Zero
[systems.tedge-raspios-armhf]
layer = "tedge-raspios"
architecture = "armhf"
target = "rpi-uboot"
