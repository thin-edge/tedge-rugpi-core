#:schema https://raw.githubusercontent.com/silitics/rugix/refs/tags/v0.8.0/schemas/rugix-bakery-recipe.schema.json
description = "install thin-edge.io"
priority = 100_000

dependencies = [
    "core/pkg-update",
]

[parameters]
# Control which thin-edge.io release channel to install from
# Values:
#   release  - Latest official build
#   main     - Latest build from the main branch (bleeding edge)
channel = { default = "main" }
