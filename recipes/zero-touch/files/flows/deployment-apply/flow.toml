name = "deployment-apply"
version = "2.0.9"

# flow will create an operation and this it must clear it as the end
expect_loop = true

input.mqtt.topics = [
    "deployment-check/startup",
    # Per-group root fragment format (new): c8y_continuous_deployment_target__{sanitized}
    # and c8y_continuous_deployment_state__{sanitized}.
    # These are root-level Cumulocity fragments so that concurrent group updates
    # never overwrite each other. The `+` wildcard matches any single-segment
    # twin topic; the JS handler filters by the expected prefix+sanitized suffix.
    "te/device/main///twin/+",
    # Legacy single-group format (kept for backward compatibility during migration)
    "te/device/main///twin/c8y_continuous_deployment_target",
    "te/device/main///twin/c8y_continuous_deployment",
    "te/device/main///cmd/device_profile/+",
]

[config]
group = "${params.group}"
c8y_proxy_client_host = "${params.c8y_proxy_client_host}"
c8y_proxy_client_port = "${params.c8y_proxy_client_port}"

[[steps]]
script = "main.js"
